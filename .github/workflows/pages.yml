name: Pages

# Publishes Sites/ and the README artwork in Assets/ to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['Sites/**', 'Assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel a deployment that has started.
concurrency:
  group: pages
  cancel-in-progress: false

# Build and deploy are separate jobs. In one job, deploy-pages can look for the
# artifact before GitHub lists it and fail with "No artifacts named github-pages".
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # The page reads its images from assets/. Copy them from Assets/ so they have one source.
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp -R Sites/. _site/
          cp Assets/AppIcon.png Assets/TartManager.png _site/assets/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
